[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raqib"
version = "0.1.0"
description = "Read only AWS IAM exposure auditor. Finds the privilege escalation paths, trust risks, and wildcard permissions attackers exploit, from an IAM export."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "SiteQ8" }]
keywords = ["aws", "iam", "security", "privilege-escalation", "cspm", "least-privilege", "blue-team"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/SiteQ8/Raqib"
Demo = "https://siteq8.github.io/Raqib/"

[project.scripts]
raqib = "raqib.__main__:main"

[tool.setuptools]
packages = ["raqib"]
