[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raqib"
version = "0.11.0"
description = "A read only cloud exposure auditor for AWS, Azure, GCP, and Kubernetes"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "SiteQ8" }]
keywords = ["aws", "azure", "gcp", "kubernetes", "iam", "rbac", "security", "privilege-escalation", "cspm", "least-privilege", "blue-team"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/SiteQ8/Raqib"
Demo = "https://siteq8.github.io/Raqib/"

[project.scripts]
raqib = "raqib.__main__:main"

[tool.setuptools]
packages = ["raqib", "raqib.lib", "raqib.models", "raqib.modules"]
